# config.yaml
num_clients: 9
num_rounds: 5                    # configurable
local_epochs: 3                  # configurable
batch_size_train: 8
batch_size_infer: 16
max_seq_length: 128
learning_rate: 2e-4
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
quant_bits: 4

sparse_training:
  enabled: true          # master toggle — when false, every client uses
                           # the normal config.lora_rank value, pipeline
                           # behaves exactly as before
  reduced_rank: 2         # LoRA rank to use for ALL clients when enabled,
                           # in place of the normal lora_rank (e.g. 8).
                           # Smaller rank = fewer trainable parameters =
                           # smaller matrices = faster forward/backward pass.

kd_lambda: 0.5                   # weight of distillation loss term
kd_warmup_rounds: 1              # rounds before KD term activates (0 = from round 1)
kd_temperature: 2.0

aggregation_mode: "accuracy_weighted"   # or "uniform"
aggregation_temperature: 1.0

public_kd_pool_size: 500         # subset of public dataset used per round for logit averaging
public_eval_holdout_size: 200    # separate held-out slice, never used in KD averaging
private_dataset_max_size: 2000   # maximum number of examples per private client dataset

seed_base: 42                    # seed_client_i = seed_base + i
checkpoint_dir: "./checkpoints"
log_dir: "./logs"
hf_token_env_var: "HF_TOKEN"

