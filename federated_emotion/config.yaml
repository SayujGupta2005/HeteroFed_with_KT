mode: "data_free_fd"

num_clients: 5
active_client_ids: [1, 2, 3, 4, 5]

num_rounds: 10
local_epochs: 2
batch_size_train: 16
batch_size_infer: 64
max_seq_length: 128
learning_rate: 2e-5
weight_decay: 0.01

bert_model_name: "bert-base-uncased"
client_capacities: [0.25, 0.25, 0.5, 0.75, 1.0]   # encoder keep ratio per client, same order as active_client_ids

dirichlet_alpha: 0.5
min_client_samples: 100
private_dataset_max_size: 4000
local_holdout_size: 200
test_set_size: 2000

kd_warmup_rounds: 1
fd_temperature: 2.0
fd_weight_by_count: true
fd_count_exponent: 1.0
fd_use_reliability: true
fd_reliability_exponent: 1.0
fd_reliability_prior: 5.0
fd_use_loss_term: false

fcfd_positions: [4, 8, 12]
fcfd_num_paths: 2
fcfd_kd_weight: 1.0
fcfd_app_weight: 1.0
fcfd_func_weight: 1.0

seed_base: 42
checkpoint_dir: "./checkpoints"
log_dir: "./logs"
hf_token_env_var: "HF_TOKEN"
